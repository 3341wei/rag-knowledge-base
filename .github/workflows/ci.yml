name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test (no network / no real keys)
        run: |
          set +e
          python -m pytest -q 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## pytest 失败（exit ${status}）"
              echo '```'
              tail -120 pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            message=$(tail -60 pytest.log | tr '\n' ' ' | sed 's/%/%25/g' | head -c 1200)
            echo "::error title=pytest 失败（exit ${status}）::${message}"
          fi
          exit "$status"

      - name: Secret scan
        run: python scripts/check_secrets.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t rag-knowledge-base:ci .

      - name: Verify image does not contain .env
        run: |
          if docker run --rm --entrypoint sh rag-knowledge-base:ci -c 'test -e /app/.env'; then
            echo "镜像中不应包含 .env" && exit 1
          fi
          echo "OK: 镜像中无 .env"
